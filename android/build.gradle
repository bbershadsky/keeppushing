// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor v8 sets Java 21 in its Gradle files, but Android Gradle Plugin 8.x
// runs best with JDK 17 on many setups. If your machine doesn't have JDK 21,
// builds can fail with: "error: invalid source release: 21".
//
// This block forces Java 17 compileOptions for all Android subprojects
// (app + Capacitor libraries) without editing node_modules.
subprojects { subproject ->
    afterEvaluate {
        def isAndroidModule =
                plugins.hasPlugin('com.android.application') ||
                plugins.hasPlugin('com.android.library')

        if (isAndroidModule && subproject.hasProperty('android')) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
